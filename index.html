<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>기홍이 홈페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<meta name="theme-color" content="#2f6b4f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="기홍이">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6b4f'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* Layout: menu tree in a left sidebar (a slide-in drawer on phones), the selected list in a narrow column with branch lines like an outline. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#1d2621; --muted:#66736b; --line:#d5ddd7;
  --accent:#2f6b4f; --accent-soft:#e2eee7; --danger:#b4432f; --danger-soft:#f6e3de; --blue:#2c5a8f; --blue-soft:#e1eaf4;
  --font-display:"Gowun Batang", "Nanum Myeongjo", serif;
  --font-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1c2420; --fg:#e4ebe6; --muted:#93a39a; --line:#2f3a34;
  --accent:#7cc39c; --accent-soft:#22352b; --danger:#ef8a74; --danger-soft:#3a2622; --blue:#8db8e8; --blue-soft:#1f2c3b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1c2420; --fg:#e4ebe6; --muted:#93a39a; --line:#2f3a34;
  --accent:#7cc39c; --accent-soft:#22352b; --danger:#ef8a74; --danger-soft:#3a2622; --blue:#8db8e8; --blue-soft:#1f2c3b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5}
body{margin:0}
[hidden]{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:20px 80px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-size:1.75rem;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sum{color:var(--muted);font-size:.875rem;font-variant-numeric:tabular-nums}
.sync{font-size:.75rem;color:var(--muted);letter-spacing:.02em}
.acct{display:flex;gap:8px;align-items:center}
.sync.err{color:var(--danger)}
.addbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;gap:8px}
.addbar input{flex:1;min-width:0}
input[type=text],input[type=password]{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=text]:focus,input[type=password]:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.btn{background:var(--accent);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;white-space:nowrap}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.875rem;color:var(--muted);padding-bottom:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
ul.tree{list-style:none;margin:0;padding:0}
ul.tree ul{list-style:none;margin:0;padding-left:22px;border-left:1px solid var(--line);margin-left:15px}
.row{display:flex;align-items:center;gap:4px;min-height:44px;border-radius:8px;padding-right:4px}
.row:hover{background:var(--surface)}
.tw{width:30px;height:30px;flex:none;display:grid;place-items:center;color:var(--muted);border-radius:6px}
.tw svg{transition:transform .15s}
.tw[aria-expanded="false"] svg{transform:rotate(-90deg)}
.tw.leaf{visibility:hidden}
.ck{width:22px;height:22px;flex:none;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;margin-right:6px}
.ck[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.ck.partial{border-color:var(--accent)}
.ck.partial::after{content:"";width:10px;height:2px;background:var(--accent)}
.txt{flex:1;min-width:0;overflow-wrap:anywhere;padding:6px 2px;cursor:text}
.done>.row .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{border-right:1px solid var(--line);background:var(--surface);padding-block:20px;padding-inline:12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:var(--font-display);font-size:1.15rem;padding:4px 8px 14px}
.nav,.nav ul{list-style:none;margin:0;padding:0}
.nav ul{padding-left:14px;margin-left:12px;border-left:1px solid var(--line)}
.nav button{width:100%;text-align:left;display:flex;align-items:center;gap:6px;padding:8px;border-radius:8px;color:var(--fg);min-height:40px}
.nav button:hover{background:var(--accent-soft)}
.nav .grp{font-weight:600}
.nav .grp svg{color:var(--muted);transition:transform .15s;flex:none}
.nav .grp[aria-expanded="false"] svg{transform:rotate(-90deg)}
.nav .leafbtn{padding-left:12px}
.nav .leafbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .n{margin-left:auto;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.topbar{display:none}
.crumb{font-size:.8rem;color:var(--muted);letter-spacing:.02em;margin-bottom:2px}
.scrim{display:none}
@media (max-width:860px){
  .shell{display:block}
  .side{position:fixed;inset:0 auto 0 0;width:min(280px,84vw);z-index:20;transform:translateX(-100%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .shell.open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .shell.open .scrim{display:block;position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.3)}
  .topbar{display:flex;align-items:center;gap:8px;padding-inline:8px;padding-block:8px 0}
  .topbar .brand{padding:0}
}
.gate{min-height:100vh;display:grid;place-items:center;padding-inline:16px}
.gate .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 24px;max-width:360px;width:100%;display:grid;gap:14px;text-align:center}
.gate h1{font-size:1.5rem}
.gate p{margin:0;color:var(--muted);font-size:.9rem}
.gate input{text-align:left}
.gate .loginerr{color:var(--danger)}
.gate .linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:.9rem;cursor:pointer;text-decoration:underline;padding:4px}
.wrap.wide{max-width:980px}
.lhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;margin-bottom:14px}
.lcard h2,.llist h2{font-size:1.05rem;margin:0}
.lcard h3,.lgroup h3{font-size:.95rem;margin:4px 0 0}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px}
.lfield{display:grid;gap:4px;min-width:0}
.llab{font-size:.8rem;color:var(--muted)}
.lin{display:flex;align-items:center;gap:6px;min-width:0}
.lin input,.lin select{flex:1;min-width:0;width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-variant-numeric:tabular-nums}
.lin input:focus,.lin select:focus{outline:2px solid var(--accent);border-color:transparent}
.lin{flex-wrap:wrap}
.lhint{font-size:.75rem;color:var(--muted);white-space:nowrap;width:100%}
.lnote{margin:0;font-size:.85rem;color:var(--muted)}
.ltiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:14px}
.ltile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.ltt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.ltile dl,.lcol dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.ltile dt,.lcol dt{color:var(--muted);font-size:.85rem}
.ltile dd,.lcol dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.pill{font-size:.75rem;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.good{background:var(--accent-soft);color:var(--accent)}
.pill.bad,.pill.none{background:var(--danger-soft);color:var(--danger)}
.pill.did{background:var(--accent-soft);color:var(--accent)}
.pill.bog{background:var(--blue-soft);color:var(--blue)}
.ltools{margin-bottom:14px}
.lbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.lbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lgroup{display:grid;gap:10px;margin-bottom:18px}
.lgroup h3 .n{font-weight:400;color:var(--muted);font-size:.8rem}
.lc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.lch{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.lname{display:grid;min-width:0}.lname b{overflow-wrap:anywhere}.lname span{font-size:.8rem;color:var(--muted)}
.lprice{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.lprice b{font-size:1.2rem;font-variant-numeric:tabular-nums}.lprice span{font-size:.8rem;color:var(--muted)}
.lcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lcol{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.lcol.on{border-color:var(--accent);background:var(--accent-soft)}
.lcolh{font-weight:600;font-size:.9rem;margin-bottom:6px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.lst{font-weight:400;font-size:.75rem;color:var(--danger)}
.lcol dd.plus{color:var(--accent)}.lcol dd.minus{color:var(--danger)}
.lmemo{margin:0;font-size:.85rem;color:var(--muted)}
.lact{display:flex;justify-content:flex-end;gap:10px;align-items:center}
.lact a{color:var(--accent);font-size:.9rem}
.chip.del{color:var(--danger)}
.ledit{border-color:var(--accent)}
.ltablewrap{overflow-x:auto}
.ltable{border-collapse:collapse;font-size:.85rem;min-width:420px}
.ltable th,.ltable td{border-bottom:1px solid var(--line);padding:6px;text-align:left;font-variant-numeric:tabular-nums}
.ltable input{width:70px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.lnotes{font-size:.8rem;color:var(--muted);padding-left:18px;display:grid;gap:4px}
@media (max-width:480px){.lcols{grid-template-columns:1fr}}
@media (min-width:1100px){.lgroup{grid-template-columns:1fr 1fr}.lgroup h3{grid-column:1/-1}}
.wtiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wtiles .ltile{padding:10px 12px}
.wtiles .ltt b{font-size:.8rem;overflow-wrap:anywhere}
.wtiles .wbig{font-size:clamp(.85rem,3.6vw,1.3rem);font-weight:600;font-variant-numeric:tabular-nums;margin-bottom:2px}
.wtot{font-weight:600;font-variant-numeric:tabular-nums}
.wlist{display:grid}
.witem{border-top:1px solid var(--line);padding-block:8px}
.wrow{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:6px 0;border-radius:6px}
.wrow:hover .wname{color:var(--accent)}
.wname{font-weight:600;min-width:0;overflow-wrap:anywhere}
.wamt{font-variant-numeric:tabular-nums;white-space:nowrap}.wamt.zero{color:var(--muted)}
.wsubs{list-style:none;margin:0;padding:0 0 0 12px;display:grid;gap:2px}
.wsubs li{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wmemo-t{font-size:.8rem;color:var(--accent);padding:4px 0}
.wmemo p{margin:0;white-space:pre-line;font-size:.85rem;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px}
.wedit{display:grid;gap:10px;border:1px solid var(--accent);border-radius:12px;padding:12px;margin-block:8px}
.wsubedit{display:grid;gap:6px}
.wsubrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto 52px auto;gap:6px;align-items:center}
.wsubrow input,.wedit textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0;width:100%}
.wedit textarea{resize:vertical}
.wx{color:var(--muted)}
.backup{margin-top:24px;padding:12px 8px 0;border-top:1px solid var(--line);display:grid;gap:8px}
.cnt{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.act{display:flex;gap:2px;flex:none}
.ib{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.ib:hover{background:var(--accent-soft);color:var(--accent)}
.ib.del:hover{color:var(--danger)}
.row input{flex:1;min-width:0;padding:6px 10px}
.childadd{display:flex;gap:6px;padding:4px 0 6px 34px}
.childadd input{flex:1;min-width:0;padding:8px 10px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty b{color:var(--fg);font-family:var(--font-display);font-size:1.15rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;display:flex;gap:14px;align-items:center;font-size:.9rem;max-width:calc(100% - 32px)}
.toast button{color:var(--bg);font-weight:600;text-decoration:underline}
@media (hover:hover){.act{opacity:.35}.row:hover .act,.row:focus-within .act{opacity:1}}
@media (prefers-reduced-motion:reduce){.tw svg,.side,.nav .grp svg{transition:none}}
</style>

</head>
<body>
<div class="shell" id="shell">
<aside class="side" id="side" aria-label="메뉴">
  <div class="brand">기홍이 홈페이지</div>
  <ul class="nav" id="nav"></ul>
  <div class="backup">
    <div class="llab">백업 (이 기기 데이터)</div>
    <div class="lbtns"><button class="chip" id="bkout" type="button">파일로 저장</button><button class="chip" id="bkin" type="button">불러오기</button></div>
  </div>
</aside>
<div class="scrim" id="scrim"></div>
<main>
<div class="topbar">
  <button class="ib" id="menubtn" aria-label="메뉴 열기"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  <span class="brand">기홍이 홈페이지</span>
</div>
<div class="wrap" id="todoview">
  <header>
    <div>
      <div class="crumb" id="crumb"></div>
      <h1 id="title">할 일 나무</h1>
      <div class="sum" id="sum">불러오는 중…</div>
    </div>
    <div class="acct"><div class="sync" id="sync"></div><button class="chip" id="auth" hidden>로그아웃</button></div>
  </header>

  <form class="addbar" id="addform">
    <input type="text" id="newtask" placeholder="새 할 일 (큰 줄기)" autocomplete="off" enterkeyhint="done">
    <button class="btn" type="submit">추가</button>
  </form>

  <div class="tools">
    <button class="chip" id="hidedone" aria-pressed="false">완료 숨기기</button>
    <button class="chip" id="expandall">모두 펼치기</button>
    <button class="chip" id="collapseall">모두 접기</button>
  </div>

  <ul class="tree" id="tree"></ul>
  <div class="empty" id="empty" hidden>
    <b>아직 할 일이 없어요</b>
    <span>위 칸에 큰 일을 적고, 각 항목의 ＋ 버튼으로 세부 할 일을 가지처럼 붙이세요.</span>
    <button class="chip" id="sample">예시 나무로 시작하기</button>
  </div>
</div>
<div class="wrap wide" id="loanview" hidden></div>
</main>
</div>
<div class="gate" id="gate" hidden>
  <form class="card" id="loginform">
    <h1>기홍이 홈페이지</h1>
    <p>계정이 있는 사람만 들어올 수 있어요.</p>
    <input type="text" id="loginid" placeholder="아이디" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    <input type="password" id="loginpw" placeholder="비밀번호" autocomplete="current-password" required>
    <input type="password" id="loginpw2" placeholder="비밀번호 한 번 더" autocomplete="new-password" hidden>
    <p class="loginerr" id="loginerr" hidden></p>
    <button class="btn" type="submit" id="loginbtn">로그인</button>
    <button class="linkbtn" type="button" id="modebtn">처음이세요? 계정 만들기</button>
  </form>
</div>
<div class="toast" id="toast" hidden><span id="toastmsg"></span><button id="undo">되돌리기</button></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="loan.js"></script>
<script src="wedding.js"></script>
<script>
const ICON = {
  chev:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  check:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 7.5l2.5 2.5L11 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 4v10M4 9h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  del:'<svg width="17" height="17" viewBox="0 0 18 18" fill="none"><path d="M4 5h10M7.5 5V3.5h3V5M5.5 5l.7 9.5h5.6l.7-9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};
// 메뉴 나무. key가 있는 항목은 각자 따로 저장되는 할 일 목록이에요.
const MENU=[
  {label:'체크리스트', children:[
    {label:'해야할일', children:[
      {key:'gihong', label:'기홍', doc:'tree', cache:'hongtodo.cache'},  // 첫 버전 데이터를 그대로 이어서 써요
      {key:'jiyeon', label:'지연'},
    ]},
  ]},
  {label:'대출계산기', key:'loan', view:'loan'},
  {label:'결혼', children:[
    {key:'wedding-check', label:'준비 체크', title:'결혼 준비 체크', seed:'check'},
    {key:'wedding-dday', label:'전날 준비물', title:'결혼식 전날 준비물', seed:'dday'},
    {key:'wedding-cost', label:'비용 정리', view:'weddingCost'},
  ]},
];
const LS_UI='hongtodo.ui';
const LISTS={}; (function walk(items,path){ items.forEach(m=>{ const p=[...path,m.label]; if(m.key) LISTS[m.key]={...m,path:p}; if(m.children) walk(m.children,p); }); })(MENU,[]);
let current=null;
const cacheKey=k=>LISTS[k].cache||('hongtodo.list.'+k);
const ls = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

let tree = [];                 // [{id,text,done,children:[]}]
let ui = Object.assign({collapsed:{}, hideDone:false, navClosed:{}}, ls.get(LS_UI)||{});
let addingTo = null, editing = null, undoState = null, toastTimer = null;
let docRef = null, saveTimer = null, saving = false, dirty = false, loaded = false;

const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function find(id, list=tree, parent=null){
  for(const n of list){
    if(n.id===id) return {node:n, list, parent};
    const r = find(id, n.children, n); if(r) return r;
  }
  return null;
}
function stats(n){ // leaf counts under a node
  if(!n.children.length) return {all:1, done:n.done?1:0};
  return n.children.reduce((a,c)=>{const s=stats(c);a.all+=s.all;a.done+=s.done;return a},{all:0,done:0});
}
function setDone(n,v){ n.done=v; n.children.forEach(c=>setDone(c,v)); }
function syncParents(list=tree){ // a parent is done when all children are done
  for(const n of list){ if(n.children.length){ syncParents(n.children); n.done = n.children.every(c=>c.done); } }
}

/* ---------- render ---------- */
function render(){
  const root = $('tree'); root.replaceChildren();
  tree.forEach(n=>{ const el=renderNode(n); if(el) root.append(el); });
  $('empty').hidden = !loaded || tree.length>0;
  const s = tree.reduce((a,n)=>{const t=stats(n);a.all+=t.all;a.done+=t.done;return a},{all:0,done:0});
  $('sum').textContent = loaded ? (s.all ? `할 일 ${s.all}개 중 ${s.done}개 완료` : '비어 있음') : '불러오는 중…';
  $('hidedone').setAttribute('aria-pressed', ui.hideDone);
  const f = document.querySelector('[data-focus]'); if(f){ f.focus(); f.removeAttribute('data-focus'); }
}
function renderNode(n){
  if(ui.hideDone && n.done) return null;
  const li = document.createElement('li'); if(n.done) li.className='done';
  const row = document.createElement('div'); row.className='row';
  const hasKids = n.children.length>0, open = !ui.collapsed[n.id];

  const tw = document.createElement('button'); tw.className='tw'+(hasKids?'':' leaf');
  tw.innerHTML=ICON.chev; tw.setAttribute('aria-expanded',open); tw.setAttribute('aria-label',open?'접기':'펼치기');
  tw.onclick=()=>{ if(open) ui.collapsed[n.id]=1; else delete ui.collapsed[n.id]; ls.set(LS_UI,ui); render(); };

  const st = stats(n);
  const ck = document.createElement('button'); ck.className='ck'; ck.setAttribute('role','checkbox');
  ck.setAttribute('aria-checked', n.done); ck.setAttribute('aria-label','완료 표시');
  if(n.done) ck.innerHTML=ICON.check; else if(hasKids && st.done>0) ck.classList.add('partial');
  ck.onclick=()=>{ setDone(n,!n.done); syncParents(); commit(); };

  row.append(tw, ck);
  if(editing===n.id){
    const inp=document.createElement('input'); inp.type='text'; inp.id='edit-'+n.id; inp.value=n.text; inp.setAttribute('data-focus','');
    const finish=save=>{ if(editing!==n.id) return; editing=null; const v=inp.value.trim(); if(save && v && v!==n.text){ n.text=v; commit(); } else render(); };
    inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();finish(true)} if(e.key==='Escape') finish(false); };
    inp.onblur=()=>finish(true);
    row.append(inp);
  } else {
    const t=document.createElement('span'); t.className='txt'; t.textContent=n.text; t.title='눌러서 수정';
    t.onclick=()=>{ editing=n.id; addingTo=null; render(); };
    row.append(t);
    if(hasKids){ const c=document.createElement('span'); c.className='cnt'; c.textContent=`${st.done}/${st.all}`; row.append(c); }
    const act=document.createElement('div'); act.className='act';
    const add=document.createElement('button'); add.className='ib'; add.innerHTML=ICON.plus; add.setAttribute('aria-label','세부 할 일 추가');
    add.onclick=()=>{ addingTo = addingTo===n.id?null:n.id; delete ui.collapsed[n.id]; editing=null; render(); };
    const del=document.createElement('button'); del.className='ib del'; del.innerHTML=ICON.del; del.setAttribute('aria-label','삭제');
    del.onclick=()=>remove(n.id);
    act.append(add,del); row.append(act);
  }
  li.append(row);

  if(addingTo===n.id){
    const f=document.createElement('form'); f.className='childadd';
    const inp=document.createElement('input'); inp.type='text'; inp.id='child-'+n.id; inp.placeholder=`'${n.text}' 아래에 추가`; inp.setAttribute('data-focus',''); inp.setAttribute('enterkeyhint','done');
    const b=document.createElement('button'); b.className='btn'; b.type='submit'; b.textContent='추가';
    f.onsubmit=e=>{ e.preventDefault(); const v=inp.value.trim(); if(!v){ addingTo=null; render(); return; }
      n.children.push({id:uid(),text:v,done:false,children:[]}); syncParents(); commit(); };
    inp.onkeydown=e=>{ if(e.key==='Escape'){ addingTo=null; render(); } };
    f.append(inp,b); li.append(f);
  }
  if(hasKids && open){
    const ul=document.createElement('ul');
    n.children.forEach(c=>{ const el=renderNode(c); if(el) ul.append(el); });
    if(ul.children.length) li.append(ul);
  }
  return li;
}

/* ---------- actions ---------- */
function remove(id){
  const r=find(id); if(!r) return;
  undoState=JSON.stringify(tree);
  r.list.splice(r.list.indexOf(r.node),1); syncParents(); commit();
  $('toastmsg').textContent=`'${r.node.text}' 삭제됨`; $('toast').hidden=false;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{$('toast').hidden=true; undoState=null},6000);
}
$('undo').onclick=()=>{ if(undoState){ tree=JSON.parse(undoState); undoState=null; commit(); } $('toast').hidden=true; };
$('addform').onsubmit=e=>{ e.preventDefault(); const v=$('newtask').value.trim(); if(!v) return;
  tree.push({id:uid(),text:v,done:false,children:[]}); $('newtask').value=''; commit(); };
$('hidedone').onclick=()=>{ ui.hideDone=!ui.hideDone; ls.set(LS_UI,ui); render(); };
$('expandall').onclick=()=>{ ui.collapsed={}; ls.set(LS_UI,ui); render(); };
$('collapseall').onclick=()=>{ const walk=l=>l.forEach(n=>{ if(n.children.length){ui.collapsed[n.id]=1; walk(n.children);} }); walk(tree); ls.set(LS_UI,ui); render(); };
$('sample').onclick=()=>{
  const mk=(text,children=[],done=false)=>({id:uid(),text,done,children});
  tree=[
    mk('예시: 개인 홈페이지',[mk('할 일 목록 만들기',[],true),mk('도메인 알아보기'),mk('다음 기능 정하기',[mk('일정 달력'),mk('메모장')])]),
    mk('예시: 이번 주 집안일',[mk('장보기'),mk('빨래',[],true)]),
  ]; syncParents(); commit();
};

/* ---------- storage ---------- */
function setSync(text,err){ const s=$('sync'); s.textContent=text; s.classList.toggle('err',!!err); }
function commit(){
  addingTo=null; render(); ls.set(cacheKey(current),tree); renderNav();
  if(!docRef){ setSync('이 기기에만 저장됨'); return; }
  dirty=true; setSync('저장 중…'); clearTimeout(saveTimer); saveTimer=setTimeout(flush,600);
}
async function flush(){
  if(saving || !dirty) return;
  saving=true; dirty=false;
  try{ await docRef.set({tree:JSON.parse(JSON.stringify(tree)), updatedAt:Date.now()}); setSync(dirty?'저장 중…':'모든 기기에 저장됨'); }
  catch(e){ if(e && e.code==='permission-denied'){ saving=false; window.denied && denied(); return; } dirty=true; setSync('저장 실패 · 연결을 확인하세요', true); }
  saving=false; if(dirty) saveTimer=setTimeout(flush,600);
}

/* ---------- menu ---------- */
function count(list){ return list.reduce((a,n)=>{const t=stats(n);a.all+=t.all;a.done+=t.done;return a},{all:0,done:0}); }
function renderNav(){
  const build=(items,path)=>items.map(m=>{
    const li=document.createElement('li'); const b=document.createElement('button');
    if(m.key){
      b.className='leafbtn'; b.textContent=m.label; if(m.key===current) b.setAttribute('aria-current','page');
      const t=m.view?[]:(m.key===current?tree:(ls.get(cacheKey(m.key))||[])); const c=count(t);
      if(c.all){ const n=document.createElement('span'); n.className='n'; n.textContent=`${c.all-c.done}`; n.title='남은 할 일'; b.append(n); }
      b.onclick=()=>{ location.hash=m.key; $('shell').classList.remove('open'); };
      li.append(b);
    } else {
      const id=[...path,m.label].join('/'), open=!ui.navClosed[id];
      b.className='grp'; b.innerHTML=ICON.chev; b.append(document.createTextNode(m.label)); b.setAttribute('aria-expanded',open);
      b.onclick=()=>{ if(open) ui.navClosed[id]=1; else delete ui.navClosed[id]; ls.set(LS_UI,ui); renderNav(); };
      li.append(b);
      if(open){ const ul=document.createElement('ul'); ul.append(...build(m.children,[...path,m.label])); li.append(ul); }
    }
    return li;
  });
  $('nav').replaceChildren(...build(MENU,[]));
}
$('menubtn').onclick=()=>$('shell').classList.add('open');
$('scrim').onclick=()=>$('shell').classList.remove('open');

/* ---------- lists & sync ---------- */
let fs=null, userId=null, unsub=null;
function watch(){
  if(unsub){ unsub(); unsub=null; }
  docRef=null;
  if(LISTS[current] && LISTS[current].view){ const V=(window.VIEWS||{})[LISTS[current].view]; V && V.sync(); return; }
  if(!fs || !userId) return;
  const L=LISTS[current], ref=fs.collection('shared').doc('home').collection('lists').doc(L.doc||L.key), key=current;  // 등록된 사람 모두가 같은 목록을 봐요
  docRef=ref; setSync('불러오는 중…');
  unsub=ref.onSnapshot(snap=>{
    if(key!==current || snap.metadata.hasPendingWrites || dirty || saving) return;
    const d=snap.exists ? snap.data() : null;
    if(d && Array.isArray(d.tree)){ tree=d.tree; }
    else if(!snap.metadata.fromCache && tree.length){ dirty=true; flush(); } // first login: push this device's list up
    ls.set(cacheKey(key),tree);
    if(editing===null && addingTo===null) render();
    renderNav(); setSync('모든 기기에 저장됨');
  }, e=>{ if(e && e.code==='permission-denied') denied(); else setSync('동기화 끊김 · 새로고침해 주세요', true); });
}
async function openList(key){
  if(!LISTS[key]) key='gihong';
  if(key===current) return;
  clearTimeout(saveTimer);
  while(saving) await new Promise(r=>setTimeout(r,100));
  if(dirty) await flush();
  if(current && LISTS[current].view){ const V=(window.VIEWS||{})[LISTS[current].view]; V && V.close(); }
  current=key; editing=null; addingTo=null;
  const L=LISTS[key];
  try{ localStorage.setItem('hong.last',key); }catch(e){}
  $('todoview').hidden=!!L.view; $('loanview').hidden=!L.view;
  if(L.view){ if(unsub){ unsub(); unsub=null; } docRef=null; document.title=`${L.title||L.label} · 기홍이 홈페이지`; renderNav(); window.VIEWS[L.view].open($('loanview')); return; }
  $('crumb').textContent=L.path.slice(0,-1).join(' › ');
  $('title').textContent=L.title||`${L.label}의 할 일`;
  document.title=`${L.title||L.label+'의 할 일'} · 기홍이 홈페이지`;
  const cached=ls.get(cacheKey(key)); tree=Array.isArray(cached)?cached:(L.seed&&window.WEDDING_SEEDS?WEDDING_SEEDS[L.seed]():[]);
  loaded=true; render(); renderNav();
  if(fs && userId) watch(); else if(!fs) setSync('이 기기에만 저장됨');
}
window.getDb=()=>({fs,userId});
window.addEventListener('hashchange',()=>openList(location.hash.slice(1)));

/* ---------- 백업 ---------- */
$('bkout').onclick=()=>{
  const data={};
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(/^hong/.test(k)) data[k]=localStorage.getItem(k); } }catch(e){}
  const blob=new Blob([JSON.stringify({site:'gihong-pag.com',savedAt:new Date().toISOString(),data},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`기홍이홈페이지-백업-${new Date().toISOString().slice(0,10)}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$('bkin').onclick=()=>{
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=async()=>{
    try{ const j=JSON.parse(await inp.files[0].text()); if(!j||!j.data) throw 0;
      Object.entries(j.data).forEach(([k,v])=>{ if(/^hong/.test(k)) localStorage.setItem(k,v); });
      location.reload();
    }catch(e){ $('toastmsg').textContent='백업 파일을 읽지 못했어요. 이 사이트에서 저장한 .json 파일인지 확인해 주세요.'; $('undo').hidden=true; $('toast').hidden=false; setTimeout(()=>{$('toast').hidden=true;$('undo').hidden=false;},4000); }
  };
  inp.click();
};

(function boot(){
  let start=location.hash.slice(1);
  if(!start){ try{ start=localStorage.getItem('hong.last')||''; }catch(e){} }
  openList(start);
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase || !cfg || !cfg.apiKey){ setSync('이 기기에만 저장됨'); return; }
  $('shell').hidden=true;
  firebase.initializeApp(cfg);
  const auth=firebase.auth(); fs=firebase.firestore();
  // 아이디는 내부적으로 "아이디@gihong-pag.com" 형태의 계정으로 바꿔서 로그인해요.
  const toEmail=id=>id.includes('@')?id:`${id}@gihong-pag.com`;
  const btn=$('auth');
  btn.onclick=()=>auth.signOut();
  const showErr=t=>{ const e=$('loginerr'); e.textContent=t; e.hidden=!t; };
  // 가입 모드: 아이디·비밀번호를 정해서 직접 계정을 만들어요. 데이터는 허용된 아이디만 볼 수 있어요(firestore.rules).
  let signup=false;
  const setMode=on=>{
    signup=on; showErr('');
    $('loginpw2').hidden=!on; $('loginpw2').required=on; $('loginpw2').value='';
    $('loginpw').autocomplete=on?'new-password':'current-password';
    $('loginpw').placeholder=on?'비밀번호 (6자 이상)':'비밀번호';
    $('loginbtn').textContent=on?'계정 만들기':'로그인';
    $('modebtn').textContent=on?'이미 계정이 있어요 · 로그인':'처음이세요? 계정 만들기';
  };
  $('modebtn').onclick=()=>setMode(!signup);
  const errMsg=c=>c.includes('too-many-requests') ? '여러 번 시도해서 잠시 막혔어요. 조금 뒤에 다시 해 주세요.'
    : c.includes('network') ? '인터넷 연결을 확인해 주세요.'
    : c.includes('email-already-in-use') ? '이미 있는 아이디예요. 로그인해 주세요.'
    : c.includes('weak-password') ? '비밀번호는 6자 이상으로 해 주세요.'
    : c.includes('operation-not-allowed') || c.includes('admin-restricted') ? '지금은 계정을 만들 수 없게 설정돼 있어요.'
    : signup ? '계정을 만들지 못했어요. 다시 해 주세요.' : '아이디 또는 비밀번호가 맞지 않아요.';
  $('loginform').onsubmit=async e=>{
    e.preventDefault(); showErr('');
    const id=$('loginid').value.trim().toLowerCase(), pw=$('loginpw').value;
    if(!id||!pw) return;
    if(signup){
      if(!/^[a-z0-9][a-z0-9._-]{1,19}$/.test(id)) return showErr('아이디는 영문 소문자·숫자로 2~20자로 해 주세요.');
      if(pw.length<6) return showErr('비밀번호는 6자 이상으로 해 주세요.');
      if(pw!==$('loginpw2').value) return showErr('비밀번호 두 개가 서로 달라요.');
    }
    const label=$('loginbtn').textContent;
    $('loginbtn').disabled=true; $('loginbtn').textContent=signup?'만드는 중…':'로그인 중…';
    try{
      if(signup) await auth.createUserWithEmailAndPassword(toEmail(id),pw);
      else await auth.signInWithEmailAndPassword(toEmail(id),pw);
      $('loginpw').value=''; $('loginpw2').value='';
    }catch(err){ showErr(errMsg(err&&err.code||'')); }
    $('loginbtn').disabled=false; $('loginbtn').textContent=label;
  };
  window.denied=()=>{ auth.signOut(); setMode(false); showErr('이 아이디는 아직 들어올 수 있게 허용되지 않았어요. 홍이 님께 말해 주세요.'); };
  auth.onAuthStateChanged(async u=>{
    // 로그인은 됐어도 허용된 아이디인지 DB에 한 번 물어보고 나서 화면을 열어요.
    if(u){ try{ await fs.collection('shared').doc('home').get(); }
      catch(e){ if(e&&e.code==='permission-denied'){ denied(); return; } } }
    userId=u?u.uid:null;
    $('shell').hidden=!u; $('gate').hidden=!!u;
    btn.hidden=!u;
    if(!u){ tree=[]; render(); setTimeout(()=>$('loginid').focus(),0); }
    watch();
  });
})();
</script>
